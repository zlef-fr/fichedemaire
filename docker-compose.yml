services:
  fichedemaire:
    build: .
    container_name: fichedemaire
    restart: unless-stopped
    network_mode: host
    environment:
      - PORT=10117
      - VAR_DIR=/app/var
      # primary brand apex (own CF zone, live 2026-07-08); fichedemaire.zlef.fr 301s here.
      - SITE_BASE=https://fichedemaire.fr
    volumes:
      - ./var:/app/var
      # data/ is rebuilt daily on the host from Sluice artifacts (see
      # scripts/refresh-data.sh + /root/bin/fiche-refresh). Bind-mounting it means
      # a refresh is a restart, not an image rebuild — the image still carries a
      # copy (COPY data ./data) so it runs standalone.
      - ./data:/app/data
